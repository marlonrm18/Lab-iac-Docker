name: Saludo

on:
  push:
    branches:
      - main
      - develop

env:
  Nombre: "Marlon Rivas"
  
jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Saludo desde main
        if: github.ref == 'refs/heads/main'
        run: echo "Hola desde main, Soy $Nombre"

      - name: Saludo desde Develop
        if: github.ref == 'refs/heads/develop'
        run: echo "Hola desde Develop, Soy $Nombre"
